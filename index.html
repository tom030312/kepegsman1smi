<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Portal Kepegawaian - SMAN 1 Sukabumi</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  /* Base Style & Color Palette (Disesuaikan dengan Logo SMAN 1) */
  :root {
    --bg-color: #0f172a;       /* Latar belakang Biru Gelap (Navy/Slate) */
    --card-bg: #1e293b;        /* Latar belakang Kartu sedikit lebih terang */
    --accent-blue: #1ca1db;    /* Biru khas Logo SMAN 1 */
    --accent-yellow: #fce116;  /* Kuning khas Logo SMAN 1 */
    --accent-red: #e30a17;     /* Merah khas Logo SMAN 1 */
    --text-main: #F8FAFC;
    --text-muted: #94A3B8;
  }

  body { 
    background-color: var(--bg-color); 
    color: var(--text-main); 
    font-family: 'Inter', sans-serif; 
    margin: 0; 
    padding: 0; 
  }

  /* Navbar dengan Garis Gradasi */
  .navbar { 
    padding: 20px 5%; 
    display: flex; 
    justify-content: space-between; 
    align-items: center; 
    background-color: #0b1120;
    position: sticky;
    top: 0;
    z-index: 999;
    /* Efek Gradasi Garis Bawah */
    border-bottom: 4px solid transparent;
    border-image: linear-gradient(to right, var(--accent-blue), var(--accent-yellow), var(--accent-red)) 1;
  }
  
  .logo { 
    font-size: 1.5rem; 
    font-weight: 700; 
    color: var(--text-main); 
    text-decoration: none; 
    letter-spacing: 1px;
  }
  .logo span { color: var(--accent-blue); }

  .container { max-width: 1200px; margin: 0 auto; padding: 0 20px 50px 20px; }
  
  /* Hero Section */
  .hero { 
    padding: 40px 0 20px 0; /* Padding atas-bawah diperkecil agar tidak terlalu jauh */
    text-align: center;
  }
  .hero-subtitle {
    font-size: 1rem;
    color: var(--accent-blue);
    text-transform: uppercase;
    letter-spacing: 2px;
    margin-bottom: 15px;
    font-weight: 700;
  }
  
  /* Wadah Judul dan Logo Bersebelahan */
  .title-wrapper {
    display: flex;
    justify-content: center;
    align-items: center;
    gap: 15px;
    flex-wrap: wrap;
    margin-bottom: 10px;
  }
  .hero-title { 
    margin: 0; 
    font-size: 3rem; 
    font-weight: 700; 
    line-height: 1.2;
  }
  .hero-logo {
    height: 70px; /* Tinggi logo disesuaikan dengan teks */
    width: auto;
    object-fit: contain;
  }
  
  .hero-desc {
    color: var(--text-muted);
    max-width: 600px;
    margin: 0 auto;
    font-size: 1.1rem;
  }
  
  /* Search Bar */
  .search-container { 
    max-width: 500px; 
    margin: 25px auto 20px auto; /* Margin diperkecil agar lebih naik ke atas */
    width: 100%; 
  }
  .search-box { 
    width: 100%; 
    padding: 14px 24px; 
    border-radius: 30px; 
    border: 1px solid rgba(255, 255, 255, 0.1); 
    background-color: rgba(255, 255, 255, 0.03); 
    color: var(--text-main); 
    font-size: 1rem; 
    font-family: 'Inter', sans-serif;
    box-sizing: border-box; 
    transition: all 0.3s ease; 
  }
  .search-box:focus { 
    outline: none; 
    background-color: rgba(255, 255, 255, 0.08); 
    border-color: var(--accent-blue);
    box-shadow: 0 0 10px rgba(28, 161, 219, 0.3); 
  }
  
  /* Grid & Card System (Merapatkan Gap dan Ukuran) */
  .grid { 
    display: grid; 
    grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); /* Lebar minimal sedikit dikurangi */
    gap: 20px; /* Celah antar kartu disesuaikan */
    margin-top: 10px; /* Posisi deretan kartu digeser naik ke atas */
  }
  
  .card { 
    background-color: var(--card-bg); 
    border-radius: 12px; 
    overflow: hidden; 
    display: flex; 
    flex-direction: column; 
    height: 100%; 
    border: 1px solid rgba(255, 255, 255, 0.05);
    transition: transform 0.3s ease, box-shadow 0.3s ease; 
    box-shadow: 0 4px 15px rgba(0,0,0,0.2);
  }
  .card:hover { 
    transform: translateY(-5px); 
    border-color: var(--accent-blue);
    box-shadow: 0 10px 25px rgba(0,0,0,0.4); 
  }
  
  /* Foto Pegawai */
  .card-img { 
    width: 100%; 
    aspect-ratio: 3/4; 
    object-fit: cover; 
    object-position: top; 
    background-color: #111827; 
  }
  
  /* Konten Kartu Dipadatkan */
  .card-body { 
    padding: 16px; 
    flex-grow: 1; 
    display: flex; 
    flex-direction: column; 
  }
  .nip { 
    font-size: 0.8rem; 
    color: var(--text-muted); 
    margin-bottom: 4px;
  }
  .nama { 
    font-size: 1.15rem; 
    font-weight: 700; 
    color: var(--text-main); 
    margin: 0 0 12px 0; 
    line-height: 1.3;
  }
  
  .pangkat-wrapper { 
    margin-top: auto; 
    display: flex;
    flex-direction: column;
    gap: 8px;
  }
  .golongan { 
    font-size: 0.9rem; 
    font-weight: 700; 
    color: var(--accent-yellow); 
  }
  
  .badge-container { display: flex; flex-wrap: wrap; gap: 6px; }
  .badge-mapel { 
    font-size: 0.7rem; 
    font-weight: 700; 
    padding: 4px 10px; 
    border-radius: 6px; 
    color: #fff; 
    background-color: var(--accent-blue); 
    letter-spacing: 0.5px;
  }

  /* Utilities */
  #loading { text-align: center; font-size: 1.1rem; color: var(--accent-blue); margin: 30px; font-weight: 600; }
  #no-result { text-align: center; font-size: 1.1rem; color: var(--text-muted); margin: 50px; display: none; width: 100%; grid-column: 1 / -1; }

  /* Responsif Layar HP Kecil */
  @media (max-width: 600px) {
    .hero-title { font-size: 2.2rem; }
    .hero-logo { height: 60px; }
    .grid { grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); gap: 15px; }
    .card-body { padding: 12px; }
    .nama { font-size: 1rem; }
  }
</style>
</head>
<body>

  <nav class="navbar">
    <a href="#" class="logo">SMAN 1 <span>SUKABUMI</span></a>
  </nav>

  <div class="container">
    <div class="hero">
      <div class="hero-subtitle">Direktori Guru & Staff</div>
      
      <!-- Wadah Judul dan Logo (Sesuai Referensi Gambar 3) -->
      <div class="title-wrapper">
        <h1 class="hero-title">Daftar Urut Kepangkatan</h1>
        <!-- UBAH "LINK_LOGO_ANDA_DISINI.png" DENGAN LOKASI/NAMA FILE LOGO SMAN 1 SUKABUMI YANG ASLI -->
        <img src="https://blogger.googleusercontent.com/img/b/R29vZ2xl/AVvXsEhqDZC1BfZwyWX3jZitY14xuvw7LI6p5DBWdGdpvsFh6iPiBoDIYncByJ0KiWMdWtJLpgrYIrUFIh-gBpnvDm6ng_oV5RO1IgoVBmlXHzQOT-oN6Qah33aMs2dZFqdpXMbLaYWEZJdto87JFGhWmrT_7pGjuzBeBA019KBJLx3emFCAXC4gkTEiBWqm_HQ/s2048/Logo%20SMAN%201%20Sukabumi.webp" alt="Logo SMAN 1 Sukabumi" class="hero-logo" onerror="this.style.display='none'">
      </div>
      
      <p class="hero-desc">Sistem Informasi Data Pegawai Terintegrasi</p>
      
      <!-- Kotak Pencarian -->
      <div class="search-container">
        <input type="text" id="searchInput" class="search-box" placeholder="Ketik nama atau NIP..." onkeyup="filterPegawai()">
      </div>
    </div>

    <div id="loading">Memuat data dari Google Sheets...</div>
    
    <!-- Area Data -->
    <div class="grid" id="grid-pegawai">
      <div id="no-result">Tidak ada data pegawai yang cocok.</div>
    </div>
  </div>

  <script>
    // MASUKKAN LINK APPSCRIPT ANDA DI SINI (JANGAN LUPA KUTIP TUNGGALNYA)
    const scriptURL = 'https://script.google.com/macros/s/AKfycbyG73_qNCkImlWoOwo5O2F2c9NMQRZGswhoH0VuUXdpLWR9QL2JeYsownHBS_YFum7TnQ/exec';

    function escapeHTML(str) {
      if (!str) return '-'; 
      return str.toString().replace(/[&<>'"]/g, function(tag) {
        const charsToReplace = { '&': '&amp;', '<': '&lt;', '>': '&gt;', "'": '&#39;', '"': '&quot;' };
        return charsToReplace[tag] || tag;
      });
    }

    async function loadData() {
      try {
        const response = await fetch(scriptURL);
        const data = await response.json();
        const grid = document.getElementById('grid-pegawai');
        const loading = document.getElementById('loading');
        
        let html = '';
        data.forEach(p => {
          html += `
            <div class="card">
              <img src="${p.Foto || 'https://via.placeholder.com/300x400/111827/1ca1db?text=No+Photo'}" class="card-img" alt="Foto ${escapeHTML(p.Nama)}">
              <div class="card-body">
                <div class="nip">NIP. ${escapeHTML(p.NIP)}</div>
                <h2 class="nama">${escapeHTML(p.Nama)}</h2>
                <div class="pangkat-wrapper">
                  <span class="golongan">${escapeHTML(p.Pangkat)} (${escapeHTML(p.Golongan)})</span>
                  <div class="badge-container">
                    <span class="badge-mapel">${escapeHTML(p.Mapel)}</span>
                  </div>
                </div>
              </div>
            </div>
          `;
        });

        grid.innerHTML = '<div id="no-result" style="display: none; grid-column: 1 / -1; text-align: center; color: #94A3B8; margin: 50px;">Tidak ada data pegawai yang cocok.</div>' + html;
        loading.style.display = 'none';
      } catch (error) {
        console.error('Error:', error);
        document.getElementById('loading').innerText = 'Koneksi terputus. Gagal memuat data.';
      }
    }

    function filterPegawai() {
      const input = document.getElementById('searchInput');
      const filter = input.value.toLowerCase();
      const grid = document.getElementById('grid-pegawai');
      const cards = grid.getElementsByClassName('card');
      const noResult = document.getElementById('no-result');
      
      let found = false;

      for (let i = 0; i < cards.length; i++) {
        const nama = cards[i].querySelector('.nama').innerText.toLowerCase();
        const nip = cards[i].querySelector('.nip').innerText.toLowerCase();
        
        if (nama.includes(filter) || nip.includes(filter)) {
          cards[i].style.display = ""; 
          found = true;
        } else {
          cards[i].style.display = "none"; 
        }
      }

      if (found) {
        noResult.style.display = "none";
      } else {
        noResult.style.display = "block";
      }
    }

    loadData();
  </script>

</body>
</html>
