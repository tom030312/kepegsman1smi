<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Portal DUK Live - SMAN 1 Sukabumi</title>
<style>
  /* Base Style */
  body { background-color: #121212; color: #e0e0e0; font-family: 'Segoe UI', sans-serif; margin: 0; padding: 0; }
  .navbar { background-color: #1e1e1e; padding: 15px 5%; display: flex; justify-content: space-between; align-items: center; position: sticky; top: 0; z-index: 100; border-bottom: 1px solid #333; }
  .logo { font-size: 1.5rem; font-weight: 900; color: #fff; text-decoration: none; }
  .logo span { color: #f39c12; }
  .container { max-width: 1200px; margin: 20px auto; padding: 0 15px; }
  
  /* Banner */
  .banner { background: linear-gradient(135deg, #2c3e50 0%, #000000 100%); border-radius: 12px; padding: 40px 30px; margin-bottom: 30px; display: flex; justify-content: space-between; align-items: center; border: 1px solid #333; }
  .banner-text h2 { margin: 0; font-size: 2rem; color: #fff; }
  
  /* Search Bar */
  .search-container { max-width: 600px; margin: 0 auto 30px auto; width: 100%; }
  .search-box { width: 100%; padding: 15px 20px; border-radius: 8px; border: 1px solid #333; background-color: #1e1e1e; color: #fff; font-size: 1rem; box-sizing: border-box; transition: all 0.3s; }
  .search-box:focus { outline: none; border-color: #f39c12; box-shadow: 0 0 10px rgba(243, 156, 18, 0.2); }
  
  /* Grid & Card System */
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); gap: 20px; }
  
  .card { background: #1e1e1e; border: 1px solid #2a2a2a; border-radius: 10px; overflow: hidden; display: flex; flex-direction: column; height: 100%; transition: 0.3s; }
  .card:hover { transform: translateY(-5px); border-color: #f39c12; box-shadow: 0 5px 15px rgba(0,0,0,0.5); }
  
  /* Perbaikan Responsivitas Gambar (Proporsi 3:4 Khas Pas Foto) */
  .card-img { width: 100%; aspect-ratio: 3/4; object-fit: cover; object-position: top; background-color: #2a2a2a; border-bottom: 2px solid #333; }
  
  .card-body { padding: 15px; flex-grow: 1; display: flex; flex-direction: column; }
  .nip { font-size: 0.8rem; color: #888; }
  .nama { font-size: 1.1rem; font-weight: 700; color: #fff; margin: 5px 0 15px 0; }
  .pangkat-wrapper { margin-top: auto; background-color: #181818; padding: 12px; border-radius: 6px; border: 1px solid #2a2a2a; }
  .golongan { font-size: 1rem; font-weight: 800; color: #f39c12; display: block; }
  .badge-container { display: flex; flex-wrap: wrap; gap: 5px; margin-top: 10px; }
  .badge-tmt, .badge-mapel { font-size: 0.7rem; font-weight: bold; padding: 4px 6px; border-radius: 4px; color: #fff; white-space: nowrap; }
  .badge-tmt { background-color: #e74c3c; }
  .badge-mapel { background-color: #2980b9; }

  /* Utilities */
  #loading { text-align: center; font-size: 1.2rem; color: #f39c12; margin: 50px; }
  #no-result { text-align: center; font-size: 1.1rem; color: #888; margin: 50px; display: none; width: 100%; grid-column: 1 / -1; }
</style>
</head>
<body>

  <nav class="navbar">
    <a href="#" class="logo">Portal<span>DUK</span></a>
  </nav>

  <div class="container">
    <div class="banner">
      <div class="banner-text">
        <h2>Daftar Urut Kepangkatan</h2>
        <p>Data Terkoneksi Google Sheets SMAN 1 Sukabumi</p>
      </div>
    </div>

    <!-- Kotak Pencarian -->
    <div class="search-container">
      <input type="text" id="searchInput" class="search-box" placeholder="Cari berdasarkan Nama atau NIP..." onkeyup="filterPegawai()">
    </div>

    <div id="loading">Memuat data pegawai...</div>
    
    <!-- Area Data -->
    <div class="grid" id="grid-pegawai">
      <!-- Hasil "Pencarian Tidak Ditemukan" -->
      <div id="no-result">Pegawai tidak ditemukan.</div>
    </div>
  </div>

  <script>
    const scriptURL = 'https://script.google.com/macros/s/AKfycbyG73_qNCkImlWoOwo5O2F2c9NMQRZGswhoH0VuUXdpLWR9QL2JeYsownHBS_YFum7TnQ/exec';

    // Pengaman XSS dan penanganan data kosong
    function escapeHTML(str) {
      if (!str) return '-'; 
      return str.toString().replace(/[&<>'"]/g, function(tag) {
        const charsToReplace = { '&': '&amp;', '<': '&lt;', '>': '&gt;', "'": '&#39;', '"': '&quot;' };
        return charsToReplace[tag] || tag;
      });
    }

    async function loadData() {
      try {
        const response = await fetch(scriptURL);
        const data = await response.json();
        const grid = document.getElementById('grid-pegawai');
        const loading = document.getElementById('loading');
        const noResult = document.getElementById('no-result');
        
        let html = '';
        data.forEach(p => {
          html += `
            <div class="card">
              <img src="${p.Foto || 'https://via.placeholder.com/300x400'}" class="card-img" alt="Foto ${escapeHTML(p.Nama)}">
              <div class="card-body">
                <div class="nip">NIP. ${escapeHTML(p.NIP)}</div>
                <h2 class="nama">${escapeHTML(p.Nama)}</h2>
                <div class="pangkat-wrapper">
                  <span class="golongan">${escapeHTML(p.Pangkat)} (${escapeHTML(p.Golongan)})</span>
                  <div class="badge-container">
                    <span class="badge-tmt">TMT: ${escapeHTML(p.TMT)}</span>
                    <span class="badge-mapel">${escapeHTML(p.Mapel)}</span>
                  </div>
                </div>
              </div>
            </div>
          `;
        });

        // Hapus elemen loading dan render kartu (pertahankan elemen no-result)
        grid.innerHTML = '<div id="no-result" style="display: none; grid-column: 1 / -1; text-align: center; color: #888; margin: 50px;">Data tidak ditemukan.</div>' + html;
        loading.style.display = 'none';
      } catch (error) {
        console.error('Error:', error);
        document.getElementById('loading').innerText = 'Gagal memuat data. Pastikan jaringan stabil.';
      }
    }

    // Fungsi Live Search Pegawai
    function filterPegawai() {
      const input = document.getElementById('searchInput');
      const filter = input.value.toLowerCase();
      const grid = document.getElementById('grid-pegawai');
      const cards = grid.getElementsByClassName('card');
      const noResult = document.getElementById('no-result');
      
      let found = false;

      for (let i = 0; i < cards.length; i++) {
        const nama = cards[i].querySelector('.nama').innerText.toLowerCase();
        const nip = cards[i].querySelector('.nip').innerText.toLowerCase();
        
        if (nama.includes(filter) || nip.includes(filter)) {
          cards[i].style.display = ""; // Munculkan kartu
          found = true;
        } else {
          cards[i].style.display = "none"; // Sembunyikan kartu
        }
      }

      // Tampilkan tulisan "Data tidak ditemukan" jika tidak ada yang cocok
      if (found) {
        noResult.style.display = "none";
      } else {
        noResult.style.display = "block";
      }
    }

    // Eksekusi fungsi loadData() saat halaman pertama kali dibuka
    loadData();
  </script>

</body>
</html>
