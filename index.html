<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Portal Kepegawaian - SMAN 1 Sukabumi</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  /* Base Style & Color Palette (Disesuaikan dengan Logo SMAN 1) */
  :root {
    --bg-color: #0f172a;       /* Latar belakang Biru Gelap (Navy/Slate) */
    --card-bg: #1e293b;        /* Latar belakang Kartu sedikit lebih terang */
    --accent-blue: #1ca1db;    /* Biru khas Logo SMAN 1 */
    --accent-yellow: #fce116;  /* Kuning khas Logo SMAN 1 */
    --accent-red: #e30a17;     /* Merah khas Logo SMAN 1 */
    --text-main: #F8FAFC;
    --text-muted: #94A3B8;
  }

  body { 
    background-color: var(--bg-color); 
    color: var(--text-main); 
    font-family: 'Inter', sans-serif; 
    margin: 0; 
    padding: 0; 
  }

  /* Navbar dengan Garis Gradasi */
  .navbar { 
    padding: 20px 5%; 
    display: flex; 
    justify-content: space-between; 
    align-items: center; 
    background-color: #0b1120;
    position: sticky;
    top: 0;
    z-index: 999;
    /* Efek Gradasi Garis Bawah */
    border-bottom: 4px solid transparent;
    border-image: linear-gradient(to right, var(--accent-blue), var(--accent-yellow), var(--accent-red)) 1;
  }
  
  .logo { 
    font-size: 1.5rem; 
    font-weight: 700; 
    color: var(--text-main); 
    text-decoration: none; 
    letter-spacing: 1px;
  }
  .logo span { color: var(--accent-blue); }

  .container { max-width: 1200px; margin: 0 auto; padding: 0 20px 50px 20px; }
  
  /* Hero Section */
  .hero { 
    padding: 40px 0 20px 0; /* Padding atas-bawah diperkecil agar tidak terlalu jauh */
    text-align: center;
  }
  .hero-subtitle {
    font-size: 1rem;
    color: var(--accent-blue);
    text-transform: uppercase;
    letter-spacing: 2px;
    margin-bottom: 15px;
    font-weight: 700;
  }
  
  /* Wadah Judul dan Logo Bersebelahan */
  .title-wrapper {
    display: flex;
    justify-content: center;
    align-items: center;
    gap: 15px;
    flex-wrap: wrap;
    margin-bottom: 10px;
  }
  .hero-title { 
    margin: 0; 
    font-size: 3rem; 
    font-weight: 700; 
    line-height: 1.2;
  }
  .hero-logo {
    height: 70px; /* Tinggi logo disesuaikan dengan teks */
    width: auto;
    object-fit: contain;
  }
  
  .hero-desc {
    color: var(--text-muted);
    max-width: 600px;
    margin: 0 auto;
    font-size: 1.1rem;
  }
  
  /* Search Bar */
  .search-container { 
    max-width: 500px; 
    margin: 25px auto 20px auto; /* Margin diperkecil agar lebih naik ke atas */
    width: 100%; 
  }
  .search-box { 
    width: 100%; 
    padding: 14px 24px; 
    border-radius: 30px; 
    border: 1px solid rgba(255, 255, 255, 0.1); 
    background-color: rgba(255, 255, 255, 0.03); 
    color: var(--text-main); 
    font-size: 1rem; 
    font-family: 'Inter', sans-serif;
    box-sizing: border-box; 
    transition: all 0.3s ease; 
  }
  .search-box:focus { 
    outline: none; 
    background-color: rgba(255, 255, 255, 0.08); 
    border-color: var(--accent-blue);
    box-shadow: 0 0 10px rgba(28, 161, 219, 0.3); 
  }
  
  /* Grid & Card System (Merapatkan Gap dan Ukuran) */
  .grid { 
    display: grid; 
    grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); /* Lebar minimal sedikit dikurangi */
    gap: 20px; /* Celah antar kartu disesuaikan */
    margin-top: 10px; /* Posisi deretan kartu digeser naik ke atas */
  }
  
  .card { 
    background-color: var(--card-bg); 
    border-radius: 12px; 
    overflow: hidden; 
    display: flex; 
    flex-direction: column; 
    height: 100%; 
    border: 1px solid rgba(255, 255, 255, 0.05);
    transition: transform 0.3s ease, box-shadow 0.3s ease; 
    box-shadow: 0 4px 15px rgba(0,0,0,0.2);
  }
  .card:hover { 
    transform: translateY(-5px); 
    border-color: var(--accent-blue);
    box-shadow: 0 10px 25px rgba(0,0,0,0.4); 
  }
  
  /* Foto Pegawai */
  .card-img { 
    width: 100%; 
    aspect-ratio: 3/4; 
    object-fit: cover; 
    object-position: top; 
    background-color: #111827; 
  }
  
  /* Konten Kartu Dipadatkan */
  .card-body { 
    padding: 16px; 
    flex-grow: 1; 
    display: flex; 
    flex-direction: column; 
  }
  .nip { 
    font-size: 0.8rem; 
    color: var(--text-muted); 
    margin-bottom: 4px;
  }
  .nama { 
    font-size: 1.15rem; 
    font-weight: 700; 
    color: var(--text-main); 
    margin: 0 0 12px 0; 
    line-height: 1.3;
  }
  
  .pangkat-wrapper { 
    margin-top: auto; 
    display: flex;
    flex-direction: column;
    gap: 8px;
  }
  .golongan { 
    font-size: 0.9rem; 
    font-weight: 700; 
    color: var(--accent-yellow); 
  }
  
  .badge-container { display: flex; flex-wrap: wrap; gap: 6px; }
  .badge-mapel { 
    font-size: 0.7rem; 
    font-weight: 700; 
    padding: 4px 10px; 
    border-radius: 6px; 
    color: #fff; 
    background-color: var(--accent-blue); 
    letter-spacing: 0.5px;
  }
/* Desain Wadah Pencarian & Filter untuk Laptop/Tablet */
.search-filter-container {
  display: flex;
  flex-direction: row; /* Berdampingan kiri-kanan */
  gap: 10px;
  justify-content: center;
  max-width: 600px;
  margin: 0 auto 30px;
  padding: 0 15px;
}

/* Memastikan kotak pencarian mengambil sisa ruang yang ada */
.search-filter-container input {
  flex: 1;
  width: 100%;
}
  /* Utilities */
  #loading { text-align: center; font-size: 1.1rem; color: var(--accent-blue); margin: 30px; font-weight: 600; }
  #no-result { text-align: center; font-size: 1.1rem; color: var(--text-muted); margin: 50px; display: none; width: 100%; grid-column: 1 / -1; }

/* =========================================
   Responsif Layar HP Kecil (Smartphone)
   ========================================= */
@media (max-width: 600px) {
  .hero-title { font-size: 1.8rem; }
  .hero-logo { height: 50px; }
  
  /* 1. Pengaturan Grid Seluruh Guru (Bawah) */
  .grid { 
    /* Menggunakan minmax 140px agar di HP layar sempit tetap muat 2 kolom berdampingan */
    grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); 
    gap: 10px; 
    padding: 0 10px; /* Sedikit jarak di kiri-kanan layar */
  }

  /* 2. Pengaturan Dalam Kartu (Teks & Spasi) */
  .card-body { 
    padding: 10px; /* Kurangi ruang kosong di dalam kartu */
  }
  .nip {
    font-size: 0.7rem; /* Perkecil NIP agar tidak terpotong */
  }
  .nama { 
    font-size: 0.9rem; /* Perkecil nama */
    line-height: 1.3;
    margin-bottom: 5px;
    word-wrap: break-word; /* PAKSA teks panjang untuk turun ke baris baru */
  }
  .golongan {
    font-size: 0.7rem;
  }
  .badge-mapel {
    font-size: 0.65rem;
    padding: 4px 6px;
  }

  /* 3. Pengaturan Khusus Jajaran Pimpinan (Geser/Swipe) */
  #grid-pimpinan {
    display: flex;
    flex-wrap: nowrap;
    overflow-x: auto;
    gap: 12px; /* Jarak antar kartu pimpinan */
    padding-bottom: 15px;
    padding-left: 10px; /* Jarak aman di sisi kiri */
    padding-right: 10px;
    scroll-snap-type: x mandatory;
    -webkit-overflow-scrolling: touch; /* Efek geser mulus di iPhone */
    scrollbar-width: none; /* Sembunyikan scrollbar di Firefox */
  }
  
  #grid-pimpinan::-webkit-scrollbar {
    display: none; /* Sembunyikan scrollbar di Chrome/Safari */
  }

  #grid-pimpinan .card {
    flex: 0 0 150px; /* Kunci lebar kartu pimpinan di angka 150px */
    scroll-snap-align: start; /* Saat digeser, kartu akan merapat rapi ke sisi kiri */
  }
  /* Membuat pencarian dan filter bertumpuk atas-bawah di HP */
  .search-filter-container {
    flex-direction: column; 
    gap: 12px;
  }

  /* Melebarkan tombol filter agar sepenuh layar dan mudah dipencet jari */
  .filter-dropdown {
    width: 100%;
    padding: 12px 15px;
    font-size: 1rem; /* Sedikit diperbesar agar nyaman dibaca di HP */
  }
}
/* ========================================= */ /* <-- PASTIKAN KODE BARU ADA DI ATAS TANDA KURUNG TUTUP INI */

  /* --- TAMBAHAN UNTUK STATISTIK & PIMPINAN --- */
  
  /* Desain Kotak Statistik */
  .stats-container {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
    gap: 15px;
    margin: 30px auto;
    max-width: 800px;
  }
  .stat-box {
    background-color: var(--card-bg);
    border: 1px solid rgba(255, 255, 255, 0.05);
    border-radius: 12px;
    padding: 20px;
    text-align: center;
    box-shadow: 0 4px 10px rgba(0,0,0,0.1);
  }
  .stat-angka {
    font-size: 2rem;
    font-weight: 700;
    color: var(--accent-yellow); /* Angka warna kuning SMAN 1 */
    margin-bottom: 5px;
  }
  .stat-label {
    font-size: 0.85rem;
    color: var(--text-muted);
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 1px;
  }

  /* Pemisah Bagian (Section Divider) */
  .section-title {
    text-align: center;
    font-size: 1.5rem;
    font-weight: 700;
    color: var(--text-main);
    margin: 40px 0 20px 0;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 15px;
  }
  .section-title::before, .section-title::after {
    content: "";
    height: 2px;
    width: 50px;
    background-color: var(--accent-blue);
    border-radius: 2px;
  }

  /* Sorotan Khusus Kepala Sekolah (Emas) */
  .card.kepsek {
    border: 2px solid var(--accent-yellow);
    box-shadow: 0 0 20px rgba(252, 225, 22, 0.15);
  }
/* Desain dasar Input Pencarian dan Select Filter */
.search-filter-container input,
.search-filter-container select {
  background-color: transparent; /* Membuat latar belakang transparan menyatu dengan tema */
  border: 1px solid rgba(255, 255, 255, 0.15); /* Garis tepi tipis dan pudar (samar) */
  border-radius: 50px; /* Melengkung penuh seperti kapsul */
  padding: 12px 25px; /* Jarak teks ke garis tepi */
  color: #ffffff; /* Warna teks putih */
  font-size: 1rem;
  font-family: inherit;
  outline: none;
  box-sizing: border-box;
}

/* Mengatur warna teks bantuan (placeholder) agar agak redup */
.search-filter-container input::placeholder {
  color: rgba(255, 255, 255, 0.4); 
}

/* Efek menyala tipis ketika kotak diklik */
.search-filter-container input:focus,
.search-filter-container select:focus {
  border-color: rgba(255, 255, 255, 0.5);
  background-color: rgba(255, 255, 255, 0.05);
}

/* KHUSUS DROPDOWN FILTER: Menghilangkan gaya bawaan browser dan membuat panah kustom */
.search-filter-container select {
  appearance: none; 
  -webkit-appearance: none;
  -moz-appearance: none;
  cursor: pointer;
  /* Membuat ikon panah ke bawah warna putih transparan */
  background-image: url("data:image/svg+xml;charset=UTF-8,%3csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='rgba(255, 255, 255, 0.5)' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'%3e%3cpolyline points='6 9 12 15 18 9'%3e%3c/polyline%3e%3c/svg%3e");
  background-repeat: no-repeat;
  background-position: right 15px center; /* Posisi panah di kanan */
  background-size: 16px;
  padding-right: 45px; /* Memberi ruang agar teks tidak tertimpa panah */
}

/* Latar belakang pilihan filter saat diklik (harus gelap agar teks putih terlihat) */
.search-filter-container select option {
  background-color: #0f172a; /* Ganti dengan warna background utama web Anda jika perlu */
  color: #ffffff;
}
</style>
</head>
<body>

  <nav class="navbar">
    <a href="#" class="logo">SMAN 1 <span>SUKABUMI</span></a>
  </nav>

  <div class="container">
    <div class="hero">
      <div class="hero-subtitle">Direktori Guru & Staff</div>
      
      <!-- Wadah Judul dan Logo (Sesuai Referensi Gambar 3) -->
      <div class="title-wrapper">
        <h1 class="hero-title">Daftar Urut Kepangkatan</h1>
        <!-- UBAH "LINK_LOGO_ANDA_DISINI.png" DENGAN LOKASI/NAMA FILE LOGO SMAN 1 SUKABUMI YANG ASLI -->
        <img src="https://blogger.googleusercontent.com/img/b/R29vZ2xl/AVvXsEhqDZC1BfZwyWX3jZitY14xuvw7LI6p5DBWdGdpvsFh6iPiBoDIYncByJ0KiWMdWtJLpgrYIrUFIh-gBpnvDm6ng_oV5RO1IgoVBmlXHzQOT-oN6Qah33aMs2dZFqdpXMbLaYWEZJdto87JFGhWmrT_7pGjuzBeBA019KBJLx3emFCAXC4gkTEiBWqm_HQ/s2048/Logo%20SMAN%201%20Sukabumi.webp" alt="Logo SMAN 1 Sukabumi" class="hero-logo" onerror="this.style.display='none'">
      </div>
       <!-- filter baru-->
<p class="hero-subtitle">Sistem Informasi Data Pegawai Terintegrasi</p>

<!-- PASTE KODE INI TEPAT DI BAWAH TEKS TERINTEGRASI -->
<div class="search-filter-container">
  <input type="text" id="searchInput" onkeyup="filterPegawai()" placeholder="Ketik nama atau NIP...">
  
  <select id="statusFilter" onchange="filterPegawai()" class="filter-dropdown">
    <option value="">Semua Status</option>
    <option value="pns">PNS</option>
    <option value="pppk">PPPK</option>
    <option value="pppk pw">PPPK PW</option>
  </select>
</div>
    <!-- === MULAI BAGIAN BARU === -->

      <!-- 2. Jajaran Pimpinan Khusus -->
      <div class="section-title">Jajaran Pimpinan</div>
      
      <!-- Grid khusus Pimpinan (Dibuat terpisah agar selalu di atas) -->
      <div class="grid" id="grid-pimpinan">
        <!-- Nanti kartu Kepala Sekolah & Wakasek bisa dimuat di sini -->
      </div>
      
      <div class="section-title" style="margin-top: 50px;">Seluruh Guru & Staff</div>
      
      <!-- === BATAS BAGIAN BARU === -->
    <div id="loading">Memuat data dari Google Sheets...</div>
    
    <!-- Area Data -->
    <div class="grid" id="grid-pegawai">
      <div id="no-result">Tidak ada data pegawai yang cocok.</div>
    </div>
  </div>
  <script>
    // MASUKKAN LINK APPSCRIPT ANDA DI SINI (JANGAN LUPA KUTIP TUNGGALNYA)
    const scriptURL = 'https://script.google.com/macros/s/AKfycbyG73_qNCkImlWoOwo5O2F2c9NMQRZGswhoH0VuUXdpLWR9QL2JeYsownHBS_YFum7TnQ/exec';

    function escapeHTML(str) {
      if (!str) return '-'; 
      return str.toString().replace(/[&<>'"]/g, function(tag) {
        const charsToReplace = { '&': '&amp;', '<': '&lt;', '>': '&gt;', "'": '&#39;', '"': '&quot;' };
        return charsToReplace[tag] || tag;
      });
    }

   async function loadData() {
      try {
        const response = await fetch(scriptURL);
        const data = await response.json();
        const gridPegawai = document.getElementById('grid-pegawai');
        const gridPimpinan = document.getElementById('grid-pimpinan'); // Area khusus pimpinan
        const loading = document.getElementById('loading');
        
        let htmlPegawai = '';
        let htmlPimpinan = '';

        data.forEach(p => {
          // Cek apakah kolom Jabatan ada isinya
          const jabatan = p.Jabatan ? p.Jabatan.toString().trim() : '';
          
          if (jabatan !== '' && jabatan !== '-') {
            // == JIKA PUNYA JABATAN (MASUK KE ATAS) ==
            // Logika otomatis: Jika teksnya 'kepala sekolah', beri efek emas, jika bukan beri warna merah.
            let extraClass = jabatan.toLowerCase().includes('kepala sekolah') ? 'kepsek' : '';
            let badgeColor = jabatan.toLowerCase().includes('kepala sekolah') ? 'var(--accent-yellow)' : 'var(--accent-blue)';
            let textColor = jabatan.toLowerCase().includes('kepala sekolah') ? '#000' : '#fff';

            htmlPimpinan += `
              <div class="card ${extraClass}">
                <img src="${p.Foto || 'https://via.placeholder.com/300x400/111827/fce116?text=Pimpinan'}" class="card-img" alt="Foto ${escapeHTML(p.Nama)}">
                <div class="card-body">
                  <div class="nip">NIP. ${escapeHTML(p.NIP)}</div>
                  <h2 class="nama">${escapeHTML(p.Nama)}</h2>
                  <div class="pangkat-wrapper">
                    <span class="golongan">${escapeHTML(p.Pangkat)} (${escapeHTML(p.Golongan)})</span>
                    <div class="badge-container">
                      <span class="badge-mapel" style="background-color: ${badgeColor}; color: ${textColor};">${escapeHTML(jabatan)}</span>
                    </div>
                  </div>
                </div>
              </div>
            `;
          } else {
            // == JIKA TIDAK PUNYA JABATAN (GURU BIASA, MASUK KE BAWAH) ==
            htmlPegawai += `
              <div class="card">
                <img src="${p.Foto || 'https://via.placeholder.com/300x400/111827/1ca1db?text=No+Photo'}" class="card-img" alt="Foto ${escapeHTML(p.Nama)}">
                <div class="card-body">
                  <div class="nip">NIP. ${escapeHTML(p.NIP)}</div>
                  <h2 class="nama">${escapeHTML(p.Nama)}</h2>
                  <div class="pangkat-wrapper">
                    <span class="golongan">${escapeHTML(p.Pangkat)} (${escapeHTML(p.Golongan)})</span>
                    <div class="badge-container">
                      <span class="badge-mapel">${escapeHTML(p.Mapel)}</span>
                    </div>
                  </div>
                </div>
              </div>
            `;
          }
        });

        // Cetak ke layar masing-masing
        gridPimpinan.innerHTML = htmlPimpinan;
        gridPegawai.innerHTML = '<div id="no-result" style="display: none; grid-column: 1 / -1; text-align: center; color: #94A3B8; margin: 50px;">Tidak ada data pegawai yang cocok.</div>' + htmlPegawai;
        loading.style.display = 'none';
      } catch (error) {
        console.error('Error:', error);
        document.getElementById('loading').innerText = 'Koneksi terputus. Gagal memuat data.';
      }
    }

    loadData();
// Filter
  function filterPegawai() {
  const searchInput = document.getElementById('searchInput').value.toLowerCase();
  const filterValue = document.getElementById('statusFilter').value.toLowerCase();
  
  const cards = document.getElementsByClassName('card');
  const noResult = document.getElementById('no-result');
  let found = false;

  for (let i = 0; i < cards.length; i++) {
    const nama = cards[i].querySelector('.nama').innerText.toLowerCase();
    const nip = cards[i].querySelector('.nip').innerText.toLowerCase();
    
    // Membaca seluruh teks di dalam kartu untuk mencari status (PNS/PPPK/dll)
    const teksKartu = cards[i].innerText.toLowerCase(); 

    const matchSearch = nama.includes(searchInput) || nip.includes(searchInput);
    const matchFilter = filterValue === "" || teksKartu.includes(filterValue);

    if (matchSearch && matchFilter) {
      cards[i].style.display = ""; 
      found = true;
    } else {
      cards[i].style.display = "none"; 
    }
  }

  if (found) {
    if (noResult) noResult.style.display = "none";
  } else {
    if (noResult) noResult.style.display = "block";
  }
}
  </script>

</body>
</html>
